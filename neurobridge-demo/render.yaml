services:
  - type: web
    name: yolyoldas
    runtime: node
    plan: free
    rootDir: neurobridge-demo
    buildCommand: npm ci --include=dev && npm --prefix server ci --include=dev && npm run build && npm --prefix server run db:generate
    startCommand: cd server && npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_USE_MOCK_API
        value: "false"
      - key: VITE_API_BASE_URL
        value: /api
